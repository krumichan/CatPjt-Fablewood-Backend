name: ${FABLE_COMPOSE_PROJECT:-fablewood-backend}
services:
  postgres:
    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    container_name: ${FABLE_PG_CONTAINER:-fablewood-postgres}
    environment:
      POSTGRES_DB: fablewood
      POSTGRES_USER: fablewood
      POSTGRES_PASSWORD: ${FABLE_PG_PASSWORD:?Use the private env file generated by Start-Backend.ps1}
    ports:
      - "127.0.0.1:${FABLE_PG_PORT:-55438}:5432"
    volumes:
      # PostgreSQL 18 stores versioned PGDATA below this mount.
      - fablewood-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 45
    restart: unless-stopped
volumes:
  fablewood-postgres-data:
    name: ${FABLE_PG_VOLUME:-fablewood-postgres-data}
